<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG PDF Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #16213e;
            border-radius: 15px;
            padding: 30px;
            width: 700px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            color: #e94560;
            text-align: center;
            margin-bottom: 5px;
            font-size: 28px;
        }

        .subtitle {
            color: #a8a8b3;
            text-align: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .upload-section {
            background-color: #0f3460;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .upload-section p {
            color: #a8a8b3;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .upload-btn {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 10px;
        }

        .upload-btn:hover {
            background-color: #c73652;
        }

        input[type="file"] {
            color: #a8a8b3;
            font-size: 14px;
        }

        .status {
            margin-top: 10px;
            font-size: 13px;
            color: #4ecca3;
        }

        .chat-box {
            background-color: #0f3460;
            border-radius: 10px;
            height: 350px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 15px;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.bot {
            align-items: flex-start;
        }

        .message-label {
            font-size: 11px;
            color: #a8a8b3;
            margin-bottom: 4px;
        }

        .message-bubble {
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 80%;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.user .message-bubble {
            background-color: #e94560;
            color: white;
        }

        .message.bot .message-bubble {
            background-color: #1a1a2e;
            color: #e0e0e0;
        }

        .input-section {
            display: flex;
            gap: 10px;
        }

        .input-section input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: none;
            background-color: #0f3460;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .input-section input::placeholder {
            color: #a8a8b3;
        }

        .send-btn {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .send-btn:hover {
            background-color: #c73652;
        }

        .thinking {
            color: #4ecca3;
            font-size: 13px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RAG PDF Chatbot</h1>
        <p class="subtitle">Upload a PDF and ask it anything!</p>

        <!-- Upload Section -->
        <div class="upload-section">
            <p>Step 1 — Upload your PDF file</p>
            <input type="file" id="pdfFile" accept=".pdf">
            <button class="upload-btn" onclick="uploadPDF()">Upload PDF</button>
            <div class="status" id="uploadStatus"></div>
        </div>

        <!-- Chat Section -->
        <div class="chat-box" id="chatBox">
            <div class="message bot">
                <div class="message-label"> Bot</div>
                <div class="message-bubble">
                    Hello! Please upload a PDF file above and then ask me anything about it. I will answer based only on what is inside the document!
                </div>
            </div>
        </div>

        <!-- Input Section -->
        <div class="input-section">
            <input 
                type="text" 
                id="questionInput" 
                placeholder="Ask a question about your PDF..."
                onkeypress="handleKeyPress(event)"
            >
            <button class="send-btn" onclick="sendQuestion()">Send</button>
        </div>
    </div>

    <script>
        // This function uploads the PDF to our Flask backend
        async function uploadPDF() {
            const fileInput = document.getElementById('pdfFile');
            const statusDiv = document.getElementById('uploadStatus');
            
            if (!fileInput.files[0]) {
                statusDiv.textContent = 'Please select a PDF file first!';
                statusDiv.style.color = '#e94560';
                return;
            }

            statusDiv.textContent = 'Uploading and processing your PDF... please wait';
            statusDiv.style.color = '#4ecca3';

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.textContent = '✅ ' + data.message;
                    statusDiv.style.color = '#4ecca3';
                    addMessage('bot', 'Your PDF has been uploaded and processed! Go ahead and ask me anything about it.');
                } else {
                    statusDiv.textContent = '❌ ' + data.error;
                    statusDiv.style.color = '#e94560';
                }
            } catch (error) {
                statusDiv.textContent = '❌ Something went wrong. Please try again.';
                statusDiv.style.color = '#e94560';
            }
        }

        // This function sends the question to our Flask backend
        async function sendQuestion() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();

            if (!question) return;

            // Show the user's question in the chat
            addMessage('user', question);
            input.value = '';

            // Show thinking message
            addMessage('bot', 'Thinking...', true);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question: question })
                });

                const data = await response.json();

                // Remove thinking message
                removeThinking();

                if (response.ok) {
                    addMessage('bot', data.answer);
                } else {
                    addMessage('bot', '❌ ' + data.error);
                }
            } catch (error) {
                removeThinking();
                addMessage('bot', '❌ Something went wrong. Please try again.');
            }
        }

        // This function adds a message to the chat box
        function addMessage(sender, text, isThinking = false) {
            const chatBox = document.getElementById('chatBox');
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            if (isThinking) messageDiv.id = 'thinking';

            const label = document.createElement('div');
            label.className = 'message-label';
            label.textContent = sender === 'user' ? ' You' : ' Bot';

            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${isThinking ? 'thinking' : ''}`;
            bubble.textContent = text;

            messageDiv.appendChild(label);
            messageDiv.appendChild(bubble);
            chatBox.appendChild(messageDiv);

            // Auto scroll to bottom
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Remove the thinking message
        function removeThinking() {
            const thinking = document.getElementById('thinking');
            if (thinking) thinking.remove();
        }

        // Allow pressing Enter to send a question
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendQuestion();
            }
        }
    </script>
</body>
</html>
